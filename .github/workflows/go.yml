name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.2'

    - name: Test
      run: go test -count=1 ./...

    - name: Race detector
      run: go test -race -count=1 ./...

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build ./...

    - name: Check whitespace errors
      run: git diff --check HEAD^ HEAD
